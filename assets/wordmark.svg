<!--
  Hysteresis Research · horizontal wordmark lockup
  ----------------------------------------------
  Mark + EN wordmark, horizontally locked. Uses live text (Newsreader 500,
  -0.014em tracking). On platforms where Newsreader is not loaded, falls
  back through the same stack as tokens.css.

  TODO before sending to a print vendor:
    Open this SVG in Inkscape → select text → Path → Object to Path.
    That converts "Hysteresis Research" into outlined paths so the
    file no longer depends on the font being installed. macOS users
    can also use: brew install inkscape; inkscape --export-text-to-path
    in.svg --export-filename=out.svg

  Cap-height (mark height) = 36px at viewBox scale. Wordmark x-height
  follows Newsreader's natural metric.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 60" role="img" aria-label="Hysteresis Research">
  <title>Hysteresis Research</title>
  <!-- Mark · left-aligned at y-baseline of text -->
  <g transform="translate(0, 12)">
    <path d="M 10 6 C 30 6, 38 7, 58 30 C 70 47, 78 53, 90 54 C 70 54, 62 53, 42 30 C 30 13, 22 7, 10 6 Z"
          fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark · Newsreader 500, -0.014em tracking, baseline-aligned with mark midpoint -->
  <text x="118" y="42"
        font-family="'Newsreader', 'Iowan Old Style', 'Charter', 'Source Serif 4', Georgia, serif"
        font-weight="500"
        font-size="34"
        letter-spacing="-0.014em"
        fill="currentColor">Hysteresis Research</text>
</svg>
