<!--
  Hysteresis Research · B-H mark · master SVG
  ----------------------------------------------
  · Single open path, no fill.
  · stroke="currentColor" — recolour by setting the parent element's color.
  · Default stroke-width 2.4 (at viewBox 100x60). Scale-equivalent at:
      28px height  → 1.4 stroke
      48px height  → 2.0 stroke
      80px height  → 2.4 stroke (default)
     132px height  → 3.0 stroke
  · Embodies the firm's edge thesis: as the field cycles, magnetisation
    lags — the enclosed area is the energy lost per cycle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" role="img" aria-label="Hysteresis Research mark">
  <title>Hysteresis Research</title>
  <path d="M 10 54 C 30 54, 38 53, 58 30 C 70 13, 78 7, 90 6 C 70 6, 62 7, 42 30 C 30 47, 22 53, 10 54 Z"
        fill="none" stroke="currentColor" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
